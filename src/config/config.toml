[server]
#host = <AUFRUF VON hostname()>
#port = 3000
#keyFile = "key.pem"
#certificateFile = "certificate.crt"
# TODO Angular HttpClient kann nur HTTP 1.1
allowHTTP1 = true

[db]
#dbUrl = <DATABASE_URL in .env>
#dbUrlAdmin = <DATABASE_URL_ADMIN in .env>
populate = true

[keycloak]
#https = true
host = "localhost"
port = 8843
#realm = "javascript"
# siehe Keycloak Menuepunkt "Clients" > Tab "Clients list" > Spalte "Client ID"
#clientId = "javascript-client"
#clientSecret = <CLIENT_SECRET in .env>
#audience = ["account"]

[mail]
#enabled = false
host = "localhost"
port = 1025
#logger = false
#from = '"Joe Doe" <Joe.Doe@acme.com>'
#to = '"Foo Bar" <Foo.Bar@acme.com>'

[log]
dir = "./log"
#file = "server.log"
# Auskommentieren fuer Lasttests
level = "debug"
pretty = true
