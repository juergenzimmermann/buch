info:
  name: Teilstring "n" auf Seite 9999
  type: http
  seq: 3

http:
  method: QUERY
  url: "{{restUrl}}"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "titel": "n",
        "page": 9999
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
