info:
  name: Ungültiges Rating 9
  type: http
  seq: 15

http:
  method: QUERY
  url: "{{restUrl}}"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "rating": 9
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
