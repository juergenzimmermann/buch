info:
  name: Nicht-vorhandener Teilstring des Titels
  type: http
  seq: 4

http:
  method: QUERY
  url: "{{restUrl}}"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "titel": "xxxx"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
